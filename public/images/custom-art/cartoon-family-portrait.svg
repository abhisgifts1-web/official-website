  <line x1="430" y1="620" x2="490" y2="400" stroke="#FFE082" stroke-width="3"/>
  <ellipse cx="500" cy="380" rx="35" ry="45" fill="url(#gold_metallic2)"/>
  <path d="M 495 425 L 505 425 L 500 435 Z" fill="#AA771C"/>

  <!-- Bottom Gold Plaque -->
