  <ellipse cx="422" cy="485" rx="14" ry="17" fill="#FFFFFF"/>
  <ellipse cx="380" cy="485" rx="9" ry="12" fill="#212121"/>
  <ellipse cx="424" cy="485" rx="9" ry="12" fill="#212121"/>
