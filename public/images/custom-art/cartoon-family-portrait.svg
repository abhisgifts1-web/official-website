      <stop offset="0%" stop-color="#1B263B"/>
      <stop offset="50%" stop-color="#2D3A54"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
    <radialGradient id="sun_glow" cx="50%" cy="40%" r="55%">
